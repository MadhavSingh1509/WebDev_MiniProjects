<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DSA Question Tracker - Master Data Structures & Algorithms</title>
  <meta name="description" content="A modern, topic-wise DSA question tracker to monitor your LeetCode and algorithmic problem-solving journey with live progress analytics.">
  <meta name="theme-color" content="#0a0d14">
  
  <!-- Modern Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Stylesheet -->
  <link rel="stylesheet" href="style.css">
  
  <!-- Prevent theme flicker on load -->
  <script>
    (function() {
      const savedTheme = localStorage.getItem("dsa_tracker_theme_v1") || 
        (window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
      document.documentElement.setAttribute("data-theme", savedTheme);
    })();
  </script>
</head>
<body>
  <!-- Ambient Glow Effects -->
  <div class="bg-glow-1"></div>
  <div class="bg-glow-2"></div>
  <div class="bg-glow-3"></div>

  <!-- Confetti Canvas -->
  <canvas id="confetti-canvas"></canvas>

  <div class="app-container">
    <!-- Header -->
    <header class="header">
      <div class="brand-wrapper">
        <div class="logo-badge">
          <!-- Terminal / Code Icon -->
          <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <polyline points="4 17 10 11 4 5"></polyline>
            <line x1="12" y1="19" x2="20" y2="19"></line>
          </svg>
        </div>
        <div class="brand-text">
          <h1>DSA Question Tracker</h1>
          <p>Curated problem sheet &bull; Track solved questions, topics &amp; analytics</p>
        </div>
      </div>

      <div class="header-actions">
        <button id="btn-random-pick" class="btn btn-ghost" title="Pick an unsolved problem at random">
          <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 12c0-1.232-.046-2.453-.138-3.662a4.006 4.006 0 00-3.7-3.7 48.678 48.678 0 00-7.324 0 4.006 4.006 0 00-3.7 3.7c-.017.22-.032.441-.046.662M19.5 12l3-3m-3 3l-3-3m-12 3c0 1.232.046 2.453.138 3.662a4.006 4.006 0 003.7 3.7 48.656 48.656 0 007.324 0 4.006 4.006 0 003.7-3.7c.017-.22.032-.441.046-.662M4.5 12l3 3m-3-3l-3 3"></path>
          </svg>
          Pick Random
        </button>
        <button id="btn-add-problem" class="btn btn-primary">
          <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15"></path>
          </svg>
          Add Problem
        </button>
        <button id="btn-export-data" class="btn btn-ghost" title="Export progress JSON backup">
          <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5m-13.5-9L12 3m0 0l4.5 4.5M12 3v13.5"></path>
          </svg>
          Export
        </button>
        <button id="btn-theme-toggle" class="btn btn-ghost theme-toggle-btn" title="Toggle Light / Dark Mode" aria-label="Toggle theme">
          <span class="theme-icon-light" id="theme-icon-sun" style="display: none;">
            <!-- Sun Icon -->
            <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v2.25m6.364.386l-1.591 1.591M21 12h-2.25m-.386 6.364l-1.591-1.591M12 18.75V21m-4.773-4.227l-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0z"></path>
            </svg>
          </span>
          <span class="theme-icon-dark" id="theme-icon-moon">
            <!-- Moon Icon -->
            <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M21.752 15.002A9.718 9.718 0 0118 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 003 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 009.002-5.998z"></path>
            </svg>
          </span>
          <span id="theme-toggle-label">Theme</span>
        </button>
        <button id="btn-reset-data" class="btn btn-ghost" title="Reset all progress">
          <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0l3.181 3.183a8.25 8.25 0 0013.803-3.7M4.031 9.865a8.25 8.25 0 0113.803-3.7l3.181 3.182m0-4.991v4.99"></path>
          </svg>
        </button>
      </div>
    </header>

    <!-- Stats Dashboard -->
    <section class="stats-grid">
      <!-- Main Circular Progress Card -->
      <div class="stat-card main-progress">
        <div class="main-progress-info">
          <h3>Total Solved</h3>
          <div class="progress-numbers">
            <span id="stat-solved-count">0</span> / <span id="stat-total-count">0</span>
          </div>
          <div class="progress-subtitle" id="stat-progress-sub">0% of question sheet completed</div>
        </div>

        <div class="circle-progress-wrapper">
          <svg class="circle-progress-svg" viewBox="0 0 100 100">
            <defs>
              <linearGradient id="progressGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#6366f1" />
                <stop offset="100%" stop-color="#06b6d4" />
              </linearGradient>
            </defs>
            <circle class="circle-bg" cx="50" cy="50" r="40" />
            <circle class="circle-fill" id="circle-progress-fill" cx="50" cy="50" r="40" />
          </svg>
          <div class="circle-percentage" id="stat-overall-percentage">0%</div>
        </div>
      </div>

      <!-- Easy Stats -->
      <div class="stat-card breakdown-card">
        <div>
          <div class="breakdown-header">
            <span class="badge badge-easy">Easy</span>
            <span class="breakdown-percentage" id="stat-easy-percent">0%</span>
          </div>
          <div class="breakdown-count">
            <span id="stat-easy-solved">0</span> / <span id="stat-easy-total">0</span>
          </div>
        </div>
        <div class="progress-bar-track">
          <div class="progress-bar-fill fill-easy" id="bar-easy-fill"></div>
        </div>
      </div>

      <!-- Medium Stats -->
      <div class="stat-card breakdown-card">
        <div>
          <div class="breakdown-header">
            <span class="badge badge-medium">Medium</span>
            <span class="breakdown-percentage" id="stat-medium-percent">0%</span>
          </div>
          <div class="breakdown-count">
            <span id="stat-medium-solved">0</span> / <span id="stat-medium-total">0</span>
          </div>
        </div>
        <div class="progress-bar-track">
          <div class="progress-bar-fill fill-medium" id="bar-medium-fill"></div>
        </div>
      </div>

      <!-- Hard Stats -->
      <div class="stat-card breakdown-card">
        <div>
          <div class="breakdown-header">
            <span class="badge badge-hard">Hard</span>
            <span class="breakdown-percentage" id="stat-hard-percent">0%</span>
          </div>
          <div class="breakdown-count">
            <span id="stat-hard-solved">0</span> / <span id="stat-hard-total">0</span>
          </div>
        </div>
        <div class="progress-bar-track">
          <div class="progress-bar-fill fill-hard" id="bar-hard-fill"></div>
        </div>
      </div>
    </section>

    <!-- Controls & Filters Section -->
    <section class="controls-section">
      <div class="search-row">
        <div class="search-input-wrapper">
          <svg class="search-icon" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 5.196a7.5 7.5 0 0010.607 10.607z"></path>
          </svg>
          <input type="text" id="search-input" class="search-input" placeholder="Search by problem name or hint...">
        </div>

        <div class="filter-group">
          <!-- Difficulty Filter -->
          <button class="filter-pill active" data-difficulty="all">All Difficulties</button>
          <button class="filter-pill" data-difficulty="Easy">Easy</button>
          <button class="filter-pill" data-difficulty="Medium">Medium</button>
          <button class="filter-pill" data-difficulty="Hard">Hard</button>
        </div>

        <div class="filter-group">
          <!-- Status Filter -->
          <button class="filter-pill active" data-status="all">All Status</button>
          <button class="filter-pill" data-status="unsolved">Unsolved</button>
          <button class="filter-pill" data-status="solved">Solved</button>
          <button class="filter-pill" data-status="bookmarked">Bookmarked</button>
        </div>
      </div>

      <!-- Quick Topic Jump / Filter Tabs -->
      <div class="topic-tabs" id="topic-tabs-container">
        <!-- Rendered via JS -->
      </div>
    </section>

    <!-- Topic Sections Container -->
    <main class="topics-container" id="topics-list-container">
      <!-- Accordions dynamically rendered via JS -->
    </main>
  </div>

  <!-- Modal: Add Custom Problem -->
  <div class="modal-overlay" id="modal-add-problem">
    <div class="modal-card">
      <div class="modal-header">
        <h3>Add New Problem</h3>
        <button class="modal-close-btn" id="modal-add-close">
          <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"></path>
          </svg>
        </button>
      </div>
      <form id="form-add-problem">
        <div class="modal-body">
          <div class="form-group">
            <label for="input-problem-title">Problem Title *</label>
            <input type="text" id="input-problem-title" class="form-input" placeholder="e.g. Course Schedule IV" required>
          </div>

          <div class="form-group">
            <label for="select-problem-topic">Topic *</label>
            <select id="select-problem-topic" class="form-select" required>
              <!-- Filled via JS -->
            </select>
          </div>

          <div class="form-group">
            <label for="select-problem-difficulty">Difficulty *</label>
            <select id="select-problem-difficulty" class="form-select" required>
              <option value="Easy">Easy</option>
              <option value="Medium" selected>Medium</option>
              <option value="Hard">Hard</option>
            </select>
          </div>

          <div class="form-group">
            <label for="input-problem-url">LeetCode / Problem URL *</label>
            <input type="url" id="input-problem-url" class="form-input" placeholder="https://leetcode.com/problems/..." required>
          </div>

          <div class="form-group">
            <label for="input-problem-hint">Key Hint or Approach</label>
            <input type="text" id="input-problem-hint" class="form-input" placeholder="Brief algorithmic pattern or reminder">
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-ghost" id="btn-cancel-add">Cancel</button>
          <button type="submit" class="btn btn-primary">Save Problem</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal: Problem Notes -->
  <div class="modal-overlay" id="modal-notes">
    <div class="modal-card">
      <div class="modal-header">
        <h3 id="notes-modal-title">Personal Notes</h3>
        <button class="modal-close-btn" id="modal-notes-close">
          <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"></path>
          </svg>
        </button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label for="textarea-notes">Your solution notes, edge cases, time/space complexity:</label>
          <textarea id="textarea-notes" class="form-textarea" rows="6" placeholder="e.g. Approach: DFS with memoization. Watch out for negative numbers! O(V + E) time, O(V) space."></textarea>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-ghost" id="btn-cancel-notes">Close</button>
        <button type="button" class="btn btn-primary" id="btn-save-notes">Save Notes</button>
      </div>
    </div>
  </div>

  <!-- Toast Notification Container -->
  <div class="toast-container" id="toast-container"></div>

  <!-- Scripts -->
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
